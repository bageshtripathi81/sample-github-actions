name: my-first-workflow

# To get trigger on every push in this repo in any branch
on: 
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"
  # push: 

jobs:
  job1: 
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Running single command in job1
        run: echo "Hi, This is my first Github workflow"
      - name: Checking OS release for Github Hosted Runner
        run: cat /etc/os-release
      - name: Calling Sleep
        run: sleep 20  

  job2: 
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: Checkin the hostname for Runner
        run: hostname
      - name: Save current date to environment
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Running multiple commands
        run: | 
          echo "Hi From Bagesh Tripathi"
          echo "Today's date is ${{ env.CURRENT_DATE }}"

  job3: 
    name: JOB3
    runs-on: windows-latest
    needs: job1
    steps:
      - name: Run Job 3
        # Windows runners use PowerShell by default, where 'sleep' is an alias for Start-Sleep
        run: sleep 10
        
  job4: 
    name: JOB4
    runs-on: macos-latest
    needs: [job1, job2, job3]
    steps:
       - name: Run job4
         run: sleep 10
