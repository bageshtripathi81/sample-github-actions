name: my-second-workflow
on:
  push:

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Append current working directory
        run: |
          echo "$(pwd)" >> myartifact.txt
          ls -ltr
          hostname
      - name: Single File Upload
        uses: actions/upload-artifact@v7
        with:
          name: single file
          path: ./myartifact.txt
          
      
        
    
